<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Crie sua conta</h1>
      <p>Preencha os dados abaixo para se cadastrar.</p>
      <form>
        <label for="name">Nome completo</label>
        <input type="text" id="name" name="name" placeholder="Seu nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>

        <label for="confirm-password">Confirme a senha</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Repita a senha" minlength="6" required>

        <button type="submit">Cadastrar</button>
      </form>
    </section>
  </main>
</body>
</html>
